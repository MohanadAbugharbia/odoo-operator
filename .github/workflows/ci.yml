---
name: CI

# Which jobs run (docs/contributing/ci.md):
#   - Unit and envtest, Lint: on every change that is not docs-only;
#   - the backup suite (PostgreSQL 16-18, kind e2e): when backup code
#     changes, on the full-ci or backup-ci label, and on every push to main;
#   - Images: on the full-ci or images-ci label.
# Adding one of those labels runs CI again with it; other labels do not.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # A new push or a CI label replaces the pull request's running CI. A label
  # CI does not use gets a group of its own, so it cancels nothing; its run
  # skips every job.
  group: >-
    ci-${{ github.event.pull_request.number || github.sha }}-${{
      (github.event.action == 'labeled' &&
       !contains(fromJSON('["full-ci", "backup-ci", "images-ci"]'), github.event.label.name))
      && github.run_id || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Decides what runs. Every job below needs it and is skipped by its `if`
    # when it does not apply; a skipped job counts as passed, so this also
    # works for required checks, which a workflow-level paths-ignore would
    # leave waiting.
    name: Changes
    if: >-
      github.event.action != 'labeled' ||
      contains(fromJSON('["full-ci", "backup-ci", "images-ci"]'), github.event.label.name)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.code.outputs.code }}
      backup: ${{ steps.decide.outputs.backup }}
      images: ${{ steps.decide.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: code
        with:
          # A file counts as code when it matches every pattern, i.e. it is
          # not one of the docs paths.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!mkdocs.yml'
              - '!LICENSE'
              - '!.github/workflows/docs.yml'
      - uses: dorny/paths-filter@v3
        id: backup
        with:
          # What the backup suite exercises beyond envtest: the agent and its
          # image, the backup and restore types, CRDs and RBAC, the backup
          # controllers and the instance work queue, schedules, the
          # dependencies (restic and pgx come from go.mod) and this workflow.
          filters: |
            backup:
              - 'internal/backup/**'
              - 'internal/schedule/**'
              - 'cmd/odoo-backup/**'
              - 'Dockerfile.backup'
              - 'hack/backup-*.sh'
              - 'test/e2e/testdata/backup/**'
              - 'api/v1/odoobackup*.go'
              - 'api/v1/odoorestore*.go'
              - 'config/crd/bases/odoo.abugharbia.com_odoobackup*.yaml'
              - 'config/crd/bases/odoo.abugharbia.com_odoorestores.yaml'
              - 'config/rbac/**'
              - 'internal/controller/odoobackupstore_*.go'
              - 'internal/controller/odoodeployment_drill.go'
              - 'internal/controller/odoodeployment_operations.go'
              - 'internal/controller/odoodeployment_retention.go'
              - 'internal/controller/odoodeployment_schedule.go'
              - 'internal/controller/odoowork_controller.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
      - name: Decide
        id: decide
        env:
          CODE: ${{ steps.code.outputs.code }}
          BACKUP_PATHS: ${{ steps.backup.outputs.backup }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          BACKUP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'backup-ci') }}
          IMAGES_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'images-ci') }}
        run: |
          backup=false
          images=false
          if [ "$EVENT" = push ]; then
            [ "$CODE" = true ] && backup=true
          else
            { [ "$FULL" = true ] || [ "$BACKUP_LABEL" = true ] || [ "$BACKUP_PATHS" = true ]; } && backup=true
            { [ "$FULL" = true ] || [ "$IMAGES_LABEL" = true ]; } && images=true
          fi
          echo "backup=$backup" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          {
            echo "### What runs"
            echo "- Unit and envtest, Lint: $CODE"
            echo "- Backup suite: $backup (backup paths changed: $BACKUP_PATHS, full-ci: $FULL, backup-ci: $BACKUP_LABEL)"
            echo "- Images: $images (full-ci: $FULL, images-ci: $IMAGES_LABEL)"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Unit and envtest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # the sticky test-results comment

    services:
      # internal/database talks to this one. Everything it asserts (the DDL,
      # the COMMENT that marks operator-owned databases, and the refusal to
      # drop a database carrying somebody else's comment) needs a real server;
      # the fake provisioner the controller suites use cannot show any of it.
      # Without TEST_PG_HOST those tests skip, so `make test` still works
      # offline.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: 5432
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # -json makes `go test` emit the machine-readable event stream the
      # summary is rendered from (go doc cmd/test2json). It is piped through
      # tee so the human-readable job log still shows the run as it happens;
      # SHELL in the Makefile already sets pipefail, and the step's own shell
      # gets it here, so a failing suite still fails the step.
      #
      # The stream also carries make's recipe echo and the tool-install
      # progress lines. That is expected: the summary script skips every line
      # that is not a JSON object, exactly as `go test -json` documents.
      - name: Run tests
        run: |
          set -o pipefail
          make test GO_TEST_FLAGS=-json | tee go-test.json

      - name: Generated files are up to date
        run: git diff --exit-code -- api/v1/zz_generated.deepcopy.go config/crd config/rbac

      - name: Build the installer bundle
        run: make build-installer VERSION=ci

      # Both artifacts are what the summary links to, so they are uploaded
      # even when the suite is red — that is when they are read.
      - name: Upload test stream
        id: upload-stream
        if: ${{ !cancelled() && hashFiles('go-test.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: go-test-json
          path: go-test.json
          retention-days: 7

      - name: Render coverage report
        id: coverage
        if: ${{ !cancelled() && hashFiles('cover.out') != '' }}
        run: go tool cover -html=cover.out -o coverage.html

      - name: Upload coverage report
        id: upload-coverage
        if: ${{ !cancelled() && hashFiles('cover.out') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            cover.out
            coverage.html
          retention-days: 7

      # Overview of the run: the job summary always, plus one sticky PR
      # comment updated in place on every run.
      - name: Write test summary
        if: ${{ !cancelled() }}
        run: |
          python3 hack/test-summary.py go-test.json \
            --coverage-profile cover.out \
            --module "$(go list -m)" \
            --artifact-url "${{ steps.upload-stream.outputs.artifact-url }}" \
            --coverage-url "${{ steps.upload-coverage.outputs.artifact-url }}" \
            > test-summary.md
          cat test-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment test summary on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # Fork PRs get a read-only token; a denied comment must not fail the job.
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: go-test-results
          path: test-summary.md

  backup-real-services:
    # The backup agent against real servers, inside the backup image built
    # from Dockerfile.backup: PostgreSQL of each tested major, an SFTP
    # server and an S3 server (hack/backup-it.sh). Restores are checked for
    # fidelity and interrupted at every step to prove they resume.
    name: Backup on PostgreSQL ${{ matrix.pg }}
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the backup tests in the backup image
        run: PG_MAJOR=${{ matrix.pg }} hack/backup-it.sh

      - name: Coverage of the backup packages
        if: ${{ !cancelled() && hashFiles('cover/*.out') != '' }}
        run: go tool cover -func=cover/backup-it-pg${{ matrix.pg }}.out | tail -n 1

      - name: Upload coverage
        if: ${{ !cancelled() && hashFiles('cover/*.out') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backup-coverage-pg${{ matrix.pg }}
          path: cover/
          retention-days: 7

  backup-e2e:
    # Backup, restore and undo of a real Odoo in kind, through an S3 store
    # and a PVC store (hack/backup-e2e.sh).
    name: Backup e2e (kind)
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: helm/kind-action@v1
        with:
          cluster_name: kind
      - name: Back up and restore Odoo
        run: hack/backup-e2e.sh

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        run: make lint

  images:
    # Publishes the operator and backup images of a pull request as
    # sha-<head sha> and pr-<number>, so a branch can be tried on a real
    # cluster before it is released. Skipped for pull requests from forks,
    # which get no package write token.
    name: Images
    needs: changes
    if: needs.changes.outputs.images == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PLATFORMS: linux/amd64,linux/arm64
      TAGS: sha-${{ github.event.pull_request.head.sha }} pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the binaries
        # Laid out as $TARGETPLATFORM/<binary>, as goreleaser does.
        run: |
          ldflags="-X main.version=sha-${{ github.event.pull_request.head.sha }}"
          for p in ${PLATFORMS//,/ }; do
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -ldflags "$ldflags" -o "$p/odoo-operator" ./cmd
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -ldflags "$ldflags" -o "$p/odoo-backup" ./cmd/odoo-backup
          done
      - name: Push the images
        run: |
          repo=ghcr.io/${GITHUB_REPOSITORY,,}
          op=() bk=()
          for t in $TAGS; do op+=(-t "$repo:$t"); bk+=(-t "$repo-backup:$t"); done
          docker buildx build --push --platform "$PLATFORMS" "${op[@]}" .
          docker buildx build --push --platform "$PLATFORMS" "${bk[@]}" -f Dockerfile.backup .
