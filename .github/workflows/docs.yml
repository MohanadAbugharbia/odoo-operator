---
# The documentation site (docs/, mkdocs.yml), on GitHub Pages from the
# gh-pages branch:
#   - every pull request builds it, strictly, and checks the generated
#     reference pages are up to date;
#   - a pull request labelled docs-preview is published under
#     pr-preview/pr-<n>/ until the label is removed or the PR closes;
#   - main is published as the "dev" version, and a release (release.yml
#     calls this workflow) as its major.minor, aliased "latest".
# See docs/contributing/docs.md.
name: Docs

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]
  push:
    branches:
      - main
  workflow_call:
    inputs:
      version:
        description: Release version (x.y.z) to publish as x.y and latest
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version (x.y.z) to publish as x.y and latest; empty publishes dev
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.action != 'unlabeled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || '' }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Generated reference pages are up to date
        run: |
          make docs-reference
          git diff --exit-code -- docs/reference

      - name: Build the site
        run: make docs-build

  preview:
    name: Preview
    # Only pull requests from this repository: a fork's token cannot push.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(github.event.pull_request.labels.*.name, 'docs-preview') ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'docs-preview'))
    runs-on: ubuntu-latest
    concurrency: gh-pages
    permissions:
      contents: write        # push to gh-pages
      pull-requests: write   # the sticky comment with the link
    steps:
      - uses: actions/checkout@v4
      - name: Deploy or remove
        id: mode
        run: |
          if [ "${{ github.event.action }}" = closed ] || [ "${{ github.event.action }}" = unlabeled ]; then
            echo "action=remove" >> "$GITHUB_OUTPUT"
          else
            echo "action=deploy" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.mode.outputs.action == 'deploy'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Build the site
        if: steps.mode.outputs.action == 'deploy'
        run: make docs-build
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: odoo-operator.abugharbia.com
          action: ${{ steps.mode.outputs.action }}

  publish:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: gh-pages
    permissions:
      contents: write        # push to gh-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || '' }}
          fetch-depth: 0     # mike commits on top of gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Publish with mike
        env:
          VERSION: ${{ inputs.version }}
        run: |
          make docs-venv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true   # absent before the first publish
          # mike runs mkdocs from PATH.
          export PATH="$PWD/bin/docs-venv/bin:$PATH"
          mike=mike
          if [ -n "$VERSION" ]; then
            minor="$(echo "$VERSION" | cut -d. -f1,2)"
            $mike deploy --push --update-aliases --title "$VERSION" "$minor" latest
            $mike set-default --push latest
          else
            $mike deploy --push --title "dev (main)" dev
            # Until the first release, the site's root opens dev.
            $mike list | grep -q latest || $mike set-default --push dev
          fi
