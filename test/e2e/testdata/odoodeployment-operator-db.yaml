# Positive scenario: the database does not exist, the operator creates and
# later drops it.
apiVersion: odoo.abugharbia.com/v1
kind: OdooDeployment
metadata:
  name: e2e-operator-db
  namespace: odoo-e2e
spec:
  name: e2e-operator-db
  image: odoo:18
  odooCommand: ["odoo"]
  database:
    hostFromSecret: { name: e2e-postgres, key: host }
    portFromSecret: { name: e2e-postgres, key: port }
    userFromSecret: { name: e2e-postgres, key: username }
    passwordFromSecret: { name: e2e-postgres, key: password }
    name: e2e_created
    createPolicy: IfNotExists
    deletionPolicy: Delete
  modules: [base]
  config:
    workers: 0
    withoutDemo: true
  odooFilestore:
    size: 1Gi
    storageClassName: standard
    deletionPolicy: Delete
