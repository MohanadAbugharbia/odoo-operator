---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: odoobackupstores.odoo.abugharbia.com
spec:
  group: odoo.abugharbia.com
  names:
    kind: OdooBackupStore
    listKind: OdooBackupStoreList
    plural: odoobackupstores
    singular: odoobackupstore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .spec.format
      name: Format
      type: string
    - jsonPath: .spec.readOnly
      name: ReadOnly
      priority: 1
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.lastCheck.result
      name: Check
      type: string
    - jsonPath: .status.storedBytes
      name: Stored
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          OdooBackupStore is a place backups are kept: an S3 bucket, an SFTP server,
          an NFS export or a PersistentVolumeClaim. OdooDeployments in the same
          namespace name it in spec.backup.stores.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OdooBackupStoreSpec is where backups are written to and read
              from.
            properties:
              check:
                description: |-
                  Check reads the store's repositories back on a schedule (restic check)
                  to find damage before a restore needs them.
                properties:
                  readDataParts:
                    default: 7
                    description: |-
                      ReadDataParts: each check reads one of this many parts of the stored
                      data, the next part on the next run, so all data is read every
                      ReadDataParts checks. 1 reads everything every time; 0 reads only the
                      repository structure.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  schedule:
                    description: Schedule in cron format ("0 5 * * 0" or @weekly);
                      empty turns checks off.
                    maxLength: 100
                    type: string
                type: object
              encryptionKeySecret:
                description: |-
                  EncryptionKeySecret is the restic password that encrypts every
                  backup in the store. Without it no backup can be read: keep a copy
                  outside the cluster. A readOnly store that only holds Odoo zip or
                  .dump files does not need one.
                properties:
                  key:
                    description: The key of the secret to select from.  Must be a
                      valid secret key.
                    type: string
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  optional:
                    description: Specify whether the Secret or its key must be defined
                    type: boolean
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
              format:
                default: restic
                description: |-
                  Format is how backups are kept. restic: one encrypted, deduplicated
                  repository per OdooDeployment at <path>/<namespace>/<deployment>/.
                enum:
                - restic
                type: string
              nfs:
                description: NFS stores backups on an NFS export.
                properties:
                  path:
                    description: Path is the exported folder. Repositories go under
                      <path>/<namespace>/<deployment>/.
                    pattern: ^/
                    type: string
                  server:
                    description: Server is the NFS server's host name or address.
                    minLength: 1
                    type: string
                required:
                - path
                - server
                type: object
              prune:
                description: |-
                  Prune frees the space of the backups retention has removed, on a
                  schedule (restic prune).
                properties:
                  schedule:
                    description: Schedule in cron format ("0 4 * * 0" or @weekly);
                      empty turns it off.
                    maxLength: 100
                    type: string
                type: object
              pvc:
                description: PVC stores backups on a PersistentVolumeClaim.
                properties:
                  claimName:
                    description: ClaimName of the PersistentVolumeClaim.
                    minLength: 1
                    type: string
                  subPath:
                    description: SubPath is a folder inside the claim. Repositories
                      go under <subPath>/<namespace>/<deployment>/.
                    maxLength: 512
                    pattern: ^/?([A-Za-z0-9._~+@=-]+(/[A-Za-z0-9._~+@=-]+)*/?)?$
                    type: string
                    x-kubernetes-validations:
                    - message: path segments cannot be . or ..
                      rule: '!self.split(''/'').exists(s, s == ''..'' || s == ''.'')'
                required:
                - claimName
                type: object
              readOnly:
                description: |-
                  ReadOnly stores are only read from: OdooRestores and
                  spec.bootstrap.fromBackup take backups from them, but no backup or
                  copy is ever written there, they are never checked or pruned, and
                  their probe only lists the store. Read-only credentials are enough,
                  and restic reads the repositories without locking them.
                type: boolean
              resources:
                description: Resources of the Jobs that probe, check and prune the
                  store.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              s3:
                description: S3 stores backups in an S3 bucket.
                properties:
                  bucket:
                    description: Bucket holding the backups.
                    maxLength: 63
                    minLength: 3
                    pattern: ^[a-z0-9][a-z0-9.-]*[a-z0-9]$
                    type: string
                  credentialsSecret:
                    description: CredentialsSecret holds AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  endpoint:
                    description: |-
                      Endpoint of an S3-compatible service, such as https://s3.example.com.
                      Leave it out for AWS.
                    pattern: ^https?://[^/\s]+/?$
                    type: string
                  forcePathStyle:
                    description: |-
                      ForcePathStyle addresses the bucket as <endpoint>/<bucket> instead of
                      <bucket>.<endpoint>. Most S3-compatible services need it; AWS does not.
                    type: boolean
                  path:
                    description: Path inside the bucket. Repositories go under <path>/<namespace>/<deployment>/.
                    maxLength: 512
                    pattern: ^/?([A-Za-z0-9._~+@=-]+(/[A-Za-z0-9._~+@=-]+)*/?)?$
                    type: string
                    x-kubernetes-validations:
                    - message: path segments cannot be . or ..
                      rule: '!self.split(''/'').exists(s, s == ''..'' || s == ''.'')'
                  region:
                    description: Region of the bucket. Optional for most S3-compatible
                      services.
                    type: string
                required:
                - bucket
                - credentialsSecret
                type: object
              sftp:
                description: SFTP stores backups on an SSH server.
                properties:
                  host:
                    description: Host of the SSH server.
                    minLength: 1
                    pattern: ^[A-Za-z0-9.:\[\]-]+$
                    type: string
                  path:
                    description: |-
                      Path on the server, relative to the user's home folder unless it
                      starts with "/". Repositories go under <path>/<namespace>/<deployment>/.
                    maxLength: 512
                    pattern: ^/?([A-Za-z0-9._~+@=-]+(/[A-Za-z0-9._~+@=-]+)*/?)?$
                    type: string
                    x-kubernetes-validations:
                    - message: path segments cannot be . or ..
                      rule: '!self.split(''/'').exists(s, s == ''..'' || s == ''.'')'
                  port:
                    default: 22
                    description: Port of the SSH server.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  sshSecret:
                    description: |-
                      SSHSecret holds the private key and the server's host key
                      (known_hosts). The private key is under id_ed25519 or, as in Secrets of
                      type kubernetes.io/ssh-auth, ssh-privatekey (id_ed25519 wins when both
                      are set). Any unencrypted Ed25519, ECDSA or RSA key works, in OpenSSH or
                      PEM format; keys with a passphrase do not. The host key is always
                      checked.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  user:
                    description: User to log in as.
                    minLength: 1
                    pattern: ^[A-Za-z0-9._-]+$
                    type: string
                required:
                - host
                - sshSecret
                - user
                type: object
              timeZone:
                default: UTC
                description: TimeZone of the check and prune schedules, as an IANA
                  name.
                maxLength: 100
                type: string
            type: object
            x-kubernetes-validations:
            - message: set exactly one of s3, sftp, nfs, pvc
              rule: '(has(self.s3) ? 1 : 0) + (has(self.sftp) ? 1 : 0) + (has(self.nfs)
                ? 1 : 0) + (has(self.pvc) ? 1 : 0) == 1'
            - message: encryptionKeySecret is required unless the store is readOnly
              rule: has(self.encryptionKeySecret) || (has(self.readOnly) && self.readOnly)
            - message: a readOnly store is never checked or pruned
              rule: '!has(self.readOnly) || !self.readOnly || ((!has(self.check) ||
                !has(self.check.schedule) || size(self.check.schedule) == 0) && (!has(self.prune)
                || !has(self.prune.schedule) || size(self.prune.schedule) == 0))'
          status:
            description: OdooBackupStoreStatus reports whether the store can be reached.
            properties:
              checkRuns:
                description: CheckRuns counts checks, to pick the part of the data
                  the next reads.
                format: int32
                type: integer
              conditions:
                description: 'Conditions: Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastCheck:
                description: LastCheck and LastPrune are the outcomes of the latest
                  check and prune.
                properties:
                  job:
                    description: Job that ran it; a failed task's Job is kept for
                      its log.
                    type: string
                  message:
                    description: Message sums up the outcome, or names what failed.
                    type: string
                  part:
                    description: Part is the part of the data a check read, such as
                      3/7.
                    type: string
                  repositories:
                    description: Repositories the task went through.
                    items:
                      type: string
                    type: array
                  result:
                    description: 'Result: Passed or Failed.'
                    enum:
                    - Passed
                    - Failed
                    type: string
                  time:
                    description: Time the task finished.
                    format: date-time
                    type: string
                type: object
              lastCheckScheduleTime:
                description: |-
                  LastCheckScheduleTime and LastPruneScheduleTime are the latest
                  scheduled times handled; NextCheckTime and NextPruneTime the next ones.
                format: date-time
                type: string
              lastProbeTime:
                description: LastProbeTime is when the store was last probed.
                format: date-time
                type: string
              lastPrune:
                description: StoreTaskStatus is the outcome of the latest check or
                  prune of a store.
                properties:
                  job:
                    description: Job that ran it; a failed task's Job is kept for
                      its log.
                    type: string
                  message:
                    description: Message sums up the outcome, or names what failed.
                    type: string
                  part:
                    description: Part is the part of the data a check read, such as
                      3/7.
                    type: string
                  repositories:
                    description: Repositories the task went through.
                    items:
                      type: string
                    type: array
                  result:
                    description: 'Result: Passed or Failed.'
                    enum:
                    - Passed
                    - Failed
                    type: string
                  time:
                    description: Time the task finished.
                    format: date-time
                    type: string
                type: object
              lastPruneScheduleTime:
                format: date-time
                type: string
              nextCheckTime:
                format: date-time
                type: string
              nextPruneTime:
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                type: integer
              probeJob:
                description: ProbeJob is the Job probing the store right now.
                type: string
              probedHash:
                description: ProbedHash identifies the spec and Secrets the last probe
                  ran with.
                type: string
              ready:
                description: |-
                  Ready is true when the last probe could write to, read from and
                  delete a file in the store (list it, for a readOnly store).
                type: boolean
              repositories:
                description: |-
                  Repositories is how many instance repositories the latest task saw,
                  StoredBytes how much they hold together.
                format: int32
                type: integer
              scheduleKey:
                description: 'Schedules the times above were computed for: check,
                  prune and time zone.'
                type: string
              storedBytes:
                format: int64
                type: integer
              taskJob:
                description: TaskJob is the check or prune Job running right now;
                  TaskKind says which.
                type: string
              taskKind:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
