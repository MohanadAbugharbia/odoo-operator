---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: odoorestores.odoo.abugharbia.com
spec:
  group: odoo.abugharbia.com
  names:
    kind: OdooRestore
    listKind: OdooRestoreList
    plural: odoorestores
    singular: odoorestore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.odooDeployment
      name: Instance
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.backup
      name: Backup
      type: string
    - jsonPath: .status.previous.state
      name: Previous
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          OdooRestore replaces an OdooDeployment's database and filestore with a
          backup, in place. Odoo is stopped while it runs; the replaced data is kept
          for keepPrevious so the restore can be undone.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OdooRestoreSpec says which backup replaces an instance's
              data.
            properties:
              backup:
                description: Backup is the OdooBackup to restore.
                minLength: 1
                type: string
              from:
                description: |-
                  From is a backup in any store: an Odoo .zip or .dump file, or a
                  snapshot in another restic repository, such as another instance's
                  or another cluster's.
                properties:
                  host:
                    description: |-
                      Host picks latest among the snapshots of one restic --host, such as
                      <namespace>/<name> for the operator's own snapshots.
                    maxLength: 253
                    type: string
                  path:
                    description: |-
                      Path inside the store, below its path (or subPath). A path ending in
                      .zip or .dump is an Odoo backup file; its last segment may be a
                      pattern (*, ?, [a-z]), and the match whose name sorts last, the
                      newest for dated names, is restored. Any other path is a restic
                      repository folder; empty is this instance's own repository
                      (<namespace>/<name>).
                    maxLength: 512
                    pattern: ^([A-Za-z0-9._~+@=-]+/)*[A-Za-z0-9._~+@=*?\[\]-]+$
                    type: string
                    x-kubernetes-validations:
                    - message: path segments cannot be . or ..
                      rule: '!self.split(''/'').exists(s, s == ''..'' || s == ''.'')'
                  snapshot:
                    description: |-
                      Snapshot in a restic repository: its ID, or latest (default) for the
                      newest snapshot with Host and Tags.
                    pattern: ^(latest|[0-9a-f]{8,64})$
                    type: string
                  store:
                    description: Store is the OdooBackupStore that holds the backup.
                    maxLength: 253
                    minLength: 1
                    type: string
                  tags:
                    description: |-
                      Tags picks latest among the snapshots that have all these restic
                      tags, such as deployment=<namespace>/<name>.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 10
                    type: array
                    x-kubernetes-list-type: atomic
                required:
                - store
                type: object
                x-kubernetes-validations:
                - message: snapshot, host and tags are for restic repositories, not
                    for .zip or .dump files
                  rule: '!has(self.path) || !(self.path.endsWith(''.zip'') || self.path.endsWith(''.dump''))
                    || (!has(self.snapshot) && !has(self.host) && !has(self.tags))'
                - message: only a .zip or .dump path may be a pattern
                  rule: '!has(self.path) || self.path.endsWith(''.zip'') || self.path.endsWith(''.dump'')
                    || !(self.path.contains(''*'') || self.path.contains(''?'') ||
                    self.path.contains(''[''))'
              keepPrevious:
                description: |-
                  KeepPrevious is how long the replaced database and files are kept
                  for an undo. Overrides spec.backup.restore.keepPrevious.
                type: string
              neutralize:
                description: |-
                  Neutralize runs Odoo's neutralize on the restored database before it
                  is swapped in, and gives it a new database.uuid: scheduled actions,
                  outgoing mail servers, payment providers and similar integrations
                  are turned off, so a copy of production cannot act as production.
                  It runs with the instance's image.
                type: boolean
              odooDeployment:
                description: OdooDeployment whose database and filestore are replaced,
                  in the same namespace.
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: spec.odooDeployment is immutable
                  rule: self == oldSelf
              snapshotID:
                description: |-
                  SnapshotID is a restic snapshot in the instance's own repository on
                  its first store (spec.backup.stores[0]), for a backup that has no
                  OdooBackup any more.
                pattern: ^[0-9a-f]{8,64}$
                type: string
              undo:
                description: |-
                  Undo reverses the OdooRestore of this name: the database and files it
                  replaced go back in place, and the ones it restored are kept as the
                  previous data of this restore. Refused once that data has been
                  removed (keepPrevious passed) or when another restore ran on the
                  instance since.
                minLength: 1
                type: string
              upgrade:
                description: |-
                  Upgrade upgrades the restored database to the instance's spec.image
                  before it is swapped in: Odoo runs -u with spec.upgrade.modules (all
                  modules when that is empty), after neutralize. Set it when the backup
                  was made by other code than the instance runs, such as a backup from
                  another Odoo: a backup from elsewhere otherwise counts as already
                  upgraded. The instance's Odoo must be the backup's series. A failed
                  upgrade fails the restore and leaves the live data as it was.
                type: boolean
            required:
            - odooDeployment
            type: object
            x-kubernetes-validations:
            - message: set exactly one of backup, snapshotID, from, undo
              rule: '(has(self.backup) ? 1 : 0) + (has(self.snapshotID) ? 1 : 0) +
                (has(self.undo) ? 1 : 0) + (has(self.from) ? 1 : 0) == 1'
            - message: backup, snapshotID, from, undo, neutralize and upgrade are
                immutable
              rule: '(has(self.backup) == has(oldSelf.backup)) && (!has(self.backup)
                || self.backup == oldSelf.backup) && (has(self.snapshotID) == has(oldSelf.snapshotID))
                && (!has(self.snapshotID) || self.snapshotID == oldSelf.snapshotID)
                && (has(self.undo) == has(oldSelf.undo)) && (!has(self.undo) || self.undo
                == oldSelf.undo) && (has(self.from) == has(oldSelf.from)) && (!has(self.from)
                || self.from == oldSelf.from) && (has(self.neutralize) ? self.neutralize
                : false) == (has(oldSelf.neutralize) ? oldSelf.neutralize : false)
                && (has(self.upgrade) ? self.upgrade : false) == (has(oldSelf.upgrade)
                ? oldSelf.upgrade : false)'
            - message: an undo puts the replaced data back as it was; neutralize cannot
                be set
              rule: '!has(self.neutralize) || !self.neutralize || !has(self.undo)'
            - message: an undo puts the replaced data back as it was; upgrade cannot
                be set
              rule: '!has(self.upgrade) || !self.upgrade || !has(self.undo)'
          status:
            description: OdooRestoreStatus describes the restore.
            properties:
              attempts:
                format: int32
                type: integer
              cleanedUp:
                description: |-
                  CleanedUp is true once the cleanup Job deleted what the restore left
                  behind (the replaced data once keepPrevious passed, any half-restored
                  copy, its journal). CleanupAttempts counts its Jobs.
                type: boolean
              cleanupAttempts:
                format: int32
                type: integer
              completedAt:
                format: date-time
                type: string
              file:
                type: string
              image:
                description: |-
                  Image is the Odoo image recorded in the backup; the instance is
                  started on it.
                type: string
              job:
                description: |-
                  Job is the Job running the restore. Attempts counts the Jobs that
                  ran it.
                type: string
              liveChangeUnconfirmed:
                description: |-
                  LiveChangeUnconfirmed is true while liveChanged rests only on
                  attempts that ended without a result after their main container may
                  have started (it ran, or the pods that would tell are gone).
                  The next attempt reads the restore journal: when it reports that the
                  swap never started, the restore fails with the live data unchanged
                  instead of being retried.
                type: boolean
              liveChanged:
                description: |-
                  LiveChanged is true once the restore may have renamed the live
                  database or files; from then on it is finished by retrying, never
                  abandoned.
                type: boolean
              message:
                description: Message explains the phase in a sentence.
                type: string
              odooVersion:
                description: OdooVersion is the Odoo series in the backup.
                type: string
              phase:
                description: |-
                  Phase: Pending, Stopping (Odoo is being stopped), Restoring,
                  Completed or Failed.
                enum:
                - Pending
                - Stopping
                - Restoring
                - Completed
                - Failed
                type: string
              previous:
                description: Previous is the data this restore replaced.
                properties:
                  database:
                    description: Database is the replaced database's name while it
                      is kept.
                    type: string
                  filestore:
                    description: Filestore is the replaced filestore folder, under
                      <dataDir>/filestore/.
                    type: string
                  image:
                    description: |-
                      Image and UpgradeToken are what the instance ran on the replaced
                      data; an undo starts Odoo on them again.
                    type: string
                  keptUntil:
                    description: KeptUntil is when the replaced data is deleted.
                    format: date-time
                    type: string
                  state:
                    description: 'State: Kept, Removed, Undone or None.'
                    type: string
                  undoneBy:
                    description: UndoneBy is the OdooRestore that put the data back.
                    type: string
                  upgradeToken:
                    type: string
                type: object
              retryAfter:
                description: |-
                  RetryAfter is when the next attempt (of the restore or its cleanup)
                  starts after a failed one.
                format: date-time
                type: string
              snapshotID:
                type: string
              startedAt:
                format: date-time
                type: string
              store:
                description: |-
                  Store and SnapshotID are the backup that was restored; File is the
                  Odoo backup file restored from Store instead of a snapshot.
                type: string
              suffix:
                description: |-
                  Suffix names the database and filestore folders of this restore:
                  <db>_restore_<suffix> while restoring, <db>_prev_<suffix> for the
                  data it replaced.
                type: string
              upgradeToken:
                description: |-
                  UpgradeToken is the upgrade token the instance counts as running once
                  the restore completed: the backup's, or for an upgraded restore
                  (spec.upgrade) the spec.upgrade.token the restore Job upgraded the
                  data for. A spec.upgrade.token that differs from it runs the upgrade.
                type: string
              warnings:
                description: Warnings found while checking the restored data.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
