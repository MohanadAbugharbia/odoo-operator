# permissions for end users to edit odoorestores.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: odoo-operator
  name: odoorestore-editor-role
rules:
- apiGroups:
  - odoo.abugharbia.com
  resources:
  - odoorestores
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - odoo.abugharbia.com
  resources:
  - odoorestores/status
  verbs:
  - get
