# permissions for end users to view odoobackups.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: odoo-operator
  name: odoobackup-viewer-role
rules:
- apiGroups:
  - odoo.abugharbia.com
  resources:
  - odoobackups
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - odoo.abugharbia.com
  resources:
  - odoobackups/status
  verbs:
  - get
