# permissions for end users to view odoobackupstores.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: odoo-operator
  name: odoobackupstore-viewer-role
rules:
- apiGroups:
  - odoo.abugharbia.com
  resources:
  - odoobackupstores
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - odoo.abugharbia.com
  resources:
  - odoobackupstores/status
  verbs:
  - get
