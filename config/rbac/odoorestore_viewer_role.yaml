# permissions for end users to view odoorestores.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: odoo-operator
  name: odoorestore-viewer-role
rules:
- apiGroups:
  - odoo.abugharbia.com
  resources:
  - odoorestores
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - odoo.abugharbia.com
  resources:
  - odoorestores/status
  verbs:
  - get
